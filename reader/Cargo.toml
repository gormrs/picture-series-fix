[package]
name = "reader"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.130"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "AddEventListenerOptions", "Document", "Element", "EventTarget", "FocusOptions",
  "HtmlDialogElement", "HtmlElement", "Node", "NodeList", "ShadowRoot",
  "ShadowRootInit", "ShadowRootMode", "Url", "Window",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
